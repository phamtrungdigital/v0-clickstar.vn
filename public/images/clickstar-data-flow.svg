<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1080 920"
  width="1080"
  height="920"
  font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
  role="img"
  aria-labelledby="flow-title flow-desc"
>
  <title id="flow-title">ClickStar Data Flow Architecture</title>
  <desc id="flow-desc">Sơ đồ luồng dữ liệu với hiệu ứng data đang chạy: MySQL và PostgreSQL hợp nhất qua ETL Pipeline vào Neon Postgres làm FlatData warehouse, phục vụ Dashboards và AI Analysis</desc>

  <defs>
    <!-- Grid pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#F1F5F9" stroke-width="1"/>
    </pattern>

    <!-- Card shadows -->
    <filter id="cardShadow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feFlood flood-color="#1B7BFF" flood-opacity="0.1"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="etlShadow" x="-5%" y="-30%" width="110%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feFlood flood-color="#8B5CF6" flood-opacity="0.18"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="neonShadow" x="-5%" y="-30%" width="110%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="5" result="offsetblur"/>
      <feFlood flood-color="#10B981" flood-opacity="0.15"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Glow filter for flowing dots -->
    <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="etlGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="50%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#EEF3FF"/>
    </linearGradient>

    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B7BFF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- ============ FLOW PATHS (cho animateMotion) ============ -->
    <!-- Layer 1 → Layer 2: 2 nguồn data → ETL -->
    <path id="flowMysqlEtl" d="M 280,160 V 210 H 540 V 260" fill="none"/>
    <path id="flowPostgresEtl" d="M 800,160 V 210 H 540 V 260" fill="none"/>

    <!-- Layer 2 → Layer 3: ETL → Neon -->
    <path id="flowEtlNeon" d="M 540,380 V 480" fill="none"/>

    <!-- Layer 3 → Layer 4: Neon → 2 consumers -->
    <path id="flowNeonDash" d="M 540,600 V 660 H 280 V 700" fill="none"/>
    <path id="flowNeonAi" d="M 540,600 V 660 H 800 V 700" fill="none"/>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1080" height="920" fill="#FFFFFF"/>
  <rect width="1080" height="920" fill="url(#grid)" opacity="0.7"/>

  <!-- ============ STATIC LINES (visible base) ============ -->
  <use href="#flowMysqlEtl" stroke="#E2E8F0" stroke-width="1.5"/>
  <use href="#flowPostgresEtl" stroke="#E2E8F0" stroke-width="1.5"/>
  <use href="#flowEtlNeon" stroke="#E2E8F0" stroke-width="1.5"/>
  <use href="#flowNeonDash" stroke="#E2E8F0" stroke-width="1.5"/>
  <use href="#flowNeonAi" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- ============ FLOWING DOTS (data particles) ============ -->

  <!-- MySQL → ETL: blue dots (raw data) -->
  <g filter="url(#dotGlow)">
    <circle r="4" fill="#1B7BFF">
      <animateMotion dur="3.5s" repeatCount="indefinite" begin="0s">
        <mpath href="#flowMysqlEtl"/>
      </animateMotion>
    </circle>
    <circle r="3" fill="#1B7BFF" opacity="0.7">
      <animateMotion dur="3.5s" repeatCount="indefinite" begin="1.2s">
        <mpath href="#flowMysqlEtl"/>
      </animateMotion>
    </circle>
    <circle r="3" fill="#1B7BFF" opacity="0.5">
      <animateMotion dur="3.5s" repeatCount="indefinite" begin="2.4s">
        <mpath href="#flowMysqlEtl"/>
      </animateMotion>
    </circle>
  </g>

  <!-- PostgreSQL → ETL: cyan dots -->
  <g filter="url(#dotGlow)">
    <circle r="4" fill="#06B6D4">
      <animateMotion dur="3.5s" repeatCount="indefinite" begin="0.6s">
        <mpath href="#flowPostgresEtl"/>
      </animateMotion>
    </circle>
    <circle r="3" fill="#06B6D4" opacity="0.7">
      <animateMotion dur="3.5s" repeatCount="indefinite" begin="1.8s">
        <mpath href="#flowPostgresEtl"/>
      </animateMotion>
    </circle>
    <circle r="3" fill="#06B6D4" opacity="0.5">
      <animateMotion dur="3.5s" repeatCount="indefinite" begin="3s">
        <mpath href="#flowPostgresEtl"/>
      </animateMotion>
    </circle>
  </g>

  <!-- Junction dot tầng 1 -->
  <circle cx="540" cy="210" r="8" fill="#1B7BFF" opacity="0.2">
    <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.05;0.2" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="540" cy="210" r="4" fill="#1B7BFF"/>

  <!-- ETL → Neon: purple dots (transformed data) -->
  <g filter="url(#dotGlow)">
    <circle r="4" fill="#8B5CF6">
      <animateMotion dur="1.8s" repeatCount="indefinite" begin="0s">
        <mpath href="#flowEtlNeon"/>
      </animateMotion>
    </circle>
    <circle r="3" fill="#8B5CF6" opacity="0.7">
      <animateMotion dur="1.8s" repeatCount="indefinite" begin="0.6s">
        <mpath href="#flowEtlNeon"/>
      </animateMotion>
    </circle>
    <circle r="3" fill="#8B5CF6" opacity="0.5">
      <animateMotion dur="1.8s" repeatCount="indefinite" begin="1.2s">
        <mpath href="#flowEtlNeon"/>
      </animateMotion>
    </circle>
  </g>

  <!-- Neon → Dashboards: green dots (clean data ready) -->
  <g filter="url(#dotGlow)">
    <circle r="4" fill="#10B981">
      <animateMotion dur="3.5s" repeatCount="indefinite" begin="0s">
        <mpath href="#flowNeonDash"/>
      </animateMotion>
    </circle>
    <circle r="3" fill="#10B981" opacity="0.7">
      <animateMotion dur="3.5s" repeatCount="indefinite" begin="1.2s">
        <mpath href="#flowNeonDash"/>
      </animateMotion>
    </circle>
    <circle r="3" fill="#10B981" opacity="0.5">
      <animateMotion dur="3.5s" repeatCount="indefinite" begin="2.4s">
        <mpath href="#flowNeonDash"/>
      </animateMotion>
    </circle>
  </g>

  <!-- Neon → AI Analysis: green dots -->
  <g filter="url(#dotGlow)">
    <circle r="4" fill="#10B981">
      <animateMotion dur="3.5s" repeatCount="indefinite" begin="0.6s">
        <mpath href="#flowNeonAi"/>
      </animateMotion>
    </circle>
    <circle r="3" fill="#10B981" opacity="0.7">
      <animateMotion dur="3.5s" repeatCount="indefinite" begin="1.8s">
        <mpath href="#flowNeonAi"/>
      </animateMotion>
    </circle>
    <circle r="3" fill="#10B981" opacity="0.5">
      <animateMotion dur="3.5s" repeatCount="indefinite" begin="3s">
        <mpath href="#flowNeonAi"/>
      </animateMotion>
    </circle>
  </g>

  <!-- Junction dot tầng 3 -->
  <circle cx="540" cy="660" r="8" fill="#10B981" opacity="0.2">
    <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.05;0.2" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="540" cy="660" r="4" fill="#10B981"/>

  <!-- ============ CARDS ============ -->

  <!-- LAYER 1: MySQL -->
  <g filter="url(#cardShadow)">
    <rect x="40" y="40" width="480" height="120" rx="16" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1.5"/>
    <rect x="64" y="64" width="72" height="72" rx="14" fill="#FFF7ED"/>
    <g transform="translate(80, 80)" stroke="#F97316" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <ellipse cx="20" cy="8" rx="16" ry="4.5"/>
      <path d="M 4,8 V 32 C 4,34.5 11.2,37 20,37 C 28.8,37 36,34.5 36,32 V 8"/>
      <path d="M 4,20 C 4,22.5 11.2,25 20,25 C 28.8,25 36,22.5 36,20"/>
    </g>
    <text x="160" y="92" font-size="24" font-weight="700" fill="#0F172A">MySQL</text>
    <text x="160" y="120" font-size="14" font-weight="500" fill="#64748B">CRM · Sales pipeline</text>
  </g>

  <!-- LAYER 1: PostgreSQL -->
  <g filter="url(#cardShadow)">
    <rect x="560" y="40" width="480" height="120" rx="16" fill="#FFFFFF" stroke="#A5F3FC" stroke-width="1.5"/>
    <rect x="584" y="64" width="72" height="72" rx="14" fill="#ECFEFF"/>
    <g transform="translate(600, 80)" stroke="#06B6D4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <ellipse cx="20" cy="8" rx="16" ry="4.5"/>
      <path d="M 4,8 V 32 C 4,34.5 11.2,37 20,37 C 28.8,37 36,34.5 36,32 V 8"/>
      <path d="M 4,20 C 4,22.5 11.2,25 20,25 C 28.8,25 36,22.5 36,20"/>
      <circle cx="28" cy="32" r="3" fill="#06B6D4"/>
    </g>
    <text x="680" y="92" font-size="24" font-weight="700" fill="#0F172A">PostgreSQL</text>
    <text x="680" y="120" font-size="14" font-weight="500" fill="#64748B">Marketing · Campaign data</text>
  </g>

  <!-- LAYER 2: ETL PIPELINE -->
  <g filter="url(#etlShadow)">
    <rect x="30" y="255" width="1020" height="130" rx="20" fill="url(#etlGrad)" opacity="0.6"/>
    <rect x="40" y="260" width="1000" height="120" rx="16" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="64" y="284" width="72" height="72" rx="14" fill="#F5F3FF"/>
    <g transform="translate(80, 300)" stroke="#8B5CF6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="10" cy="10" r="6"/>
      <circle cx="30" cy="30" r="6"/>
      <path d="M 14,14 L 26,26"/>
      <path d="M 10,16 V 24 M 6,20 H 14" stroke-width="1.5"/>
      <path d="M 30,16 V 24 M 26,20 H 34" stroke-width="1.5"/>
    </g>
    <text x="160" y="312" font-size="24" font-weight="700" fill="#0F172A">ETL Pipeline</text>
    <text x="160" y="340" font-size="14" font-weight="500" fill="#64748B">Đồng bộ mỗi giờ · ngừa drift · 99.9% uptime</text>
  </g>

  <!-- LAYER 3: NEON POSTGRES -->
  <g filter="url(#neonShadow)">
    <rect x="40" y="480" width="1000" height="120" rx="16" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.5"/>
    <rect x="64" y="504" width="72" height="72" rx="14" fill="#ECFDF5"/>
    <g transform="translate(80, 520)" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="4" y="4" width="32" height="10" rx="2"/>
      <rect x="4" y="18" width="32" height="10" rx="2"/>
      <rect x="4" y="32" width="32" height="6" rx="2"/>
      <circle cx="10" cy="9" r="1.5" fill="#10B981"/>
      <circle cx="10" cy="23" r="1.5" fill="#10B981"/>
    </g>
    <text x="160" y="532" font-size="24" font-weight="700" fill="#0F172A">Neon Postgres</text>
    <text x="160" y="562" font-size="14" font-weight="500" font-family="'JetBrains Mono', 'Courier New', monospace">
      <tspan fill="#10B981" font-weight="600">analytics.facts_daily</tspan>
      <tspan dx="8" fill="#94A3B8">·</tspan>
      <tspan dx="8" fill="#64748B">flat denormalized</tspan>
    </text>
  </g>

  <!-- LAYER 4: Dashboards -->
  <g filter="url(#cardShadow)">
    <rect x="40" y="700" width="480" height="120" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
    <rect x="64" y="724" width="72" height="72" rx="14" fill="#EFF6FF"/>
    <g transform="translate(80, 740)">
      <path d="M 4,36 V 4" stroke="#1B7BFF" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <path d="M 4,36 H 36" stroke="#1B7BFF" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <rect x="10" y="22" width="6" height="14" fill="#1B7BFF" rx="1"/>
      <rect x="20" y="14" width="6" height="22" fill="#1B7BFF" rx="1"/>
      <rect x="30" y="8" width="6" height="28" fill="#1B7BFF" rx="1"/>
    </g>
    <text x="160" y="752" font-size="24" font-weight="700" fill="#0F172A">Dashboards</text>
    <text x="160" y="780" font-size="14" font-weight="500" fill="#64748B">Looker · Metabase · Custom UI</text>
  </g>

  <!-- LAYER 4: AI Analysis -->
  <g filter="url(#cardShadow)">
    <rect x="560" y="700" width="480" height="120" rx="16" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5"/>
    <rect x="584" y="724" width="72" height="72" rx="14" fill="#F5F3FF"/>
    <g transform="translate(600, 740)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 18,6 C 14,6 10,8 10,12 C 6,12 4,15 6,19 C 4,22 6,26 10,26 C 10,30 14,32 18,30 V 6 Z" stroke="url(#aiGrad)" stroke-width="2"/>
      <path d="M 22,6 C 26,6 30,8 30,12 C 34,12 36,15 34,19 C 36,22 34,26 30,26 C 30,30 26,32 22,30 V 6 Z" stroke="url(#aiGrad)" stroke-width="2"/>
      <circle cx="14" cy="14" r="1.5" fill="#1B7BFF" stroke="none"/>
      <circle cx="14" cy="22" r="1.5" fill="#8B5CF6" stroke="none"/>
      <circle cx="26" cy="14" r="1.5" fill="#1B7BFF" stroke="none"/>
      <circle cx="26" cy="22" r="1.5" fill="#8B5CF6" stroke="none"/>
      <path d="M 14,14 L 14,22" stroke="#8B5CF6" stroke-width="1" opacity="0.5"/>
      <path d="M 26,14 L 26,22" stroke="#8B5CF6" stroke-width="1" opacity="0.5"/>
      <path d="M 20,18 L 20,14 M 20,18 L 20,22 M 20,18 L 16,18 M 20,18 L 24,18" stroke="url(#aiGrad)" stroke-width="1.2" opacity="0.7"/>
    </g>
    <text x="680" y="752" font-size="24" font-weight="700" fill="#0F172A">AI Analysis</text>
    <text x="680" y="780" font-size="14" font-weight="500" fill="#64748B">Claude · GPT · Gemini · Custom prompts</text>
  </g>

  <!-- DATA FLOW INDICATOR -->
  <g transform="translate(960, 870)" opacity="0.6">
    <text x="0" y="0" font-size="11" font-weight="600" fill="#64748B" letter-spacing="1.5" text-anchor="end">DATA FLOW · LIVE</text>
    <circle cx="6" cy="6" r="3" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

</svg>
