# Generated by ClickStarDeploy. Edit via the ClickStarDeploy dashboard, not by hand.
autodeploy:
  stage: deploy
  image: alpine:3.20
  resource_group: autodeploy-dev-clickstar-vn
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  variables:
    AD_HOST: "180.93.42.33"
    AD_PORT: "22"
    AD_USER: "root"
    AD_APP_DIR: "/var/www/dev-clickstar-vn"
    AD_DOMAIN: "dev.clickstar.vn"
    AD_APP_PORT: "3001"
    AD_SLUG: "dev-clickstar-vn"
    AD_SCRIPTS: "https://gitlab.clickstar.vn:8443/ci/scripts"
  environment:
    name: production
    url: https://dev.clickstar.vn
  before_script:
    - |
      if ! command -v rsync >/dev/null 2>&1 || ! command -v ssh >/dev/null 2>&1; then
        if command -v apk >/dev/null 2>&1; then apk add --no-cache openssh-client rsync >/dev/null
        else
          # Debian security mirrors sometimes list a patched .deb before serving it (404): retry,
          # then fall back to the release's own rsync.
          apt-get update -qq >/dev/null; export DEBIAN_FRONTEND=noninteractive
          apt-get install -y -qq --no-install-recommends openssh-client rsync >/dev/null 2>&1 ||
            apt-get install -y -qq --no-install-recommends --fix-missing openssh-client rsync >/dev/null 2>&1 ||
            apt-get install -y -qq --no-install-recommends "rsync/$(. /etc/os-release; echo $VERSION_CODENAME)" >/dev/null
        fi
      fi
    - install -m 600 "$AUTODEPLOY_SSH_KEY" /tmp/id_key
    - export SSH_OPTS="-i /tmp/id_key -p $AD_PORT -o UserKnownHostsFile=$AUTODEPLOY_KNOWN_HOSTS -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPath=/tmp/ad-ssh-%C -o ControlPersist=300"
    - export TARGET="$AD_USER@$AD_HOST"
  script:
    - export RELEASE="$(date +%Y%m%d%H%M%S)-$CI_COMMIT_SHORT_SHA"
    - export RELEASE_DIR="$AD_APP_DIR/releases/$RELEASE"
    # Fixed steps come from ClickStarDeploy itself, so every project runs today's checks even when its
    # repo copy is older; the repo copy is the fallback when ClickStarDeploy cannot be reached.
    - |
      for f in release.sh lib.sh; do
        [ -f .autodeploy/$f ] || continue
        if (curl -fsS -m 15 -o /tmp/ad-$f "$AD_SCRIPTS/$f" 2>/dev/null || wget -q -T 15 -O /tmp/ad-$f "$AD_SCRIPTS/$f" 2>/dev/null) && head -n 1 /tmp/ad-$f | grep -q '^#!'; then
          cp /tmp/ad-$f .autodeploy/$f
        else
          echo "!!  Không tải được $f mới nhất từ ClickStarDeploy, dùng bản trong repo"
        fi
      done
    # Make room first (keep the live release + 4 newest, failed ones included), then refuse to
    # start when the disk is nearly full instead of failing halfway through the copy.
    - |
      ssh $SSH_OPTS "$TARGET" "set -e; mkdir -p $AD_APP_DIR/releases $AD_APP_DIR/shared $AD_APP_DIR/.source
        cd $AD_APP_DIR/releases; cur=\$(basename \"\$(readlink -f $AD_APP_DIR/current 2>/dev/null)\")
        ls -1t | grep -vxF \"\$cur\" | tail -n +5 | xargs -r rm -rf
        free=\$(df -Pk $AD_APP_DIR | awk 'NR==2 {print \$4}')
        if [ \"\$free\" -lt 1048576 ]; then echo \"AUTODEPLOY_DISK_FULL: server chi con \$((free / 1024))MB trong o $AD_APP_DIR, can it nhat 1GB. Hay don o dia roi chay lai.\"; exit 1; fi"
    # Sync into a persistent source copy (only changed files travel), then hard-link it into the
    # release: unchanged files (images, design assets...) take no extra disk space per release.
    - rsync -az --delete --exclude .git --exclude /.cache --exclude .next/cache/ -e "ssh $SSH_OPTS" ./ "$TARGET:$AD_APP_DIR/.source/"
    - ssh $SSH_OPTS "$TARGET" "cp -al $AD_APP_DIR/.source $RELEASE_DIR"
    - if [ -n "${AUTODEPLOY_ENV_FILE:-}" ] && [ -s "$AUTODEPLOY_ENV_FILE" ]; then rsync -az -e "ssh $SSH_OPTS" "$AUTODEPLOY_ENV_FILE" "$TARGET:$AD_APP_DIR/shared/.env"; fi
    # deploy.sh runs at the lowest CPU and disk priority so the live site stays responsive.
    - |
      ssh $SSH_OPTS "$TARGET" "cd $RELEASE_DIR && N='nice -n 19'; command -v ionice >/dev/null && N=\"\$N ionice -c3\"; APP_DIR=$AD_APP_DIR RELEASE_DIR=$RELEASE_DIR SHARED_DIR=$AD_APP_DIR/shared DOMAIN=$AD_DOMAIN APP_PORT=$AD_APP_PORT APP_SLUG=$AD_SLUG BASH_ENV=$RELEASE_DIR/.autodeploy/lib.sh AD_ROOT=$RELEASE_DIR \$N bash .autodeploy/deploy.sh"
    - ssh $SSH_OPTS "$TARGET" "cd $RELEASE_DIR && APP_DIR=$AD_APP_DIR RELEASE_DIR=$RELEASE_DIR SHARED_DIR=$AD_APP_DIR/shared DOMAIN=$AD_DOMAIN APP_PORT=$AD_APP_PORT APP_SLUG=$AD_SLUG bash .autodeploy/release.sh"
    - |
      ssh $SSH_OPTS "$TARGET" "cd $AD_APP_DIR/releases; cur=\$(basename \"\$(readlink -f $AD_APP_DIR/current)\"); ls -1t | grep -vxF \"\$cur\" | tail -n +5 | xargs -r rm -rf"
